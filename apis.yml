apis:
- name: Wyze Developer API
  description: Official Wyze token-issuance API for third-party integrations. Users
    create an API key in the Wyze Developer API Console, then POST to /api/user/login
    with Keyid and Apikey headers to obtain an access token (valid 2 days) and refresh
    token (valid 30 days), refreshed via api.wyzecam.com/app/user/refresh_token. The
    login endpoint is rate limited.
  humanURL: https://support.wyze.com/hc/en-us/articles/16129834216731-Creating-an-API-Key
