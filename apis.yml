aid: wyzecam
name: Wyze Labs
description: 'Wyze Labs (wyze.com, formerly wyzecam.com) is a Seattle-area smart home
  company backed by Norwest Venture Partners, selling affordable security cameras,
  doorbells, locks, lighting, and sensors. Wyze publishes an official Developer API
  Console where users generate an API key (one per account, valid one year) to obtain
  access and refresh tokens for third-party integrations such as Home Bridge, and
  its Shopify storefront exposes an agent-ready commerce surface: llms.txt/agents.md
  instructions, OpenID Connect discovery, and a Universal Commerce Protocol (UCP)
  merchant profile with a hosted MCP shopping endpoint.'
